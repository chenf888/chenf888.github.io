name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            CFbook/package-lock.json
            CFword/package-lock.json

      - name: 安装 CFbook 依赖
        run: npm ci
        working-directory: CFbook

      - name: 构建 CFbook
        run: npm run build
        working-directory: CFbook

      - name: 安装 CFword 依赖
        run: npm ci
        working-directory: CFword

      - name: 构建 CFword
        run: npm run build
        working-directory: CFword

      # 本仓库为 chenf888.github.io 用户页，主页（仓库根静态文件）与
      # 各子路径应用（/CFbook、/CFword）需合并到同一站点：主页在根。
      - name: 组装站点（主页 + /CFbook/ + /CFword/）
        run: |
          mkdir -p _site
          tar \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./CFbook' \
            --exclude='./CFword' \
            --exclude='./node_modules' \
            --exclude='./_site' \
            -cf - . | tar -xf - -C _site
          mkdir -p _site/CFbook
          cp -a CFbook/dist/. _site/CFbook/
          mkdir -p _site/CFword
          cp -a CFword/dist/. _site/CFword/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4